domain_observations:
  - Accounting is the largest cluster: ~538 localization modules across both editions provide country charts, taxes, EDI and statutory reporting.
  - Enterprise payroll depends on country payroll localizations (hr_payroll + l10n_xx_hr_payroll), all Enterprise-side in 19.0.
  - Bridge modules (auto_install) knit apps together; they explain why installing two apps activates extra features without user action.
  - The web client (web), mail (chatter/activities) and base are the universal foundations nearly everything depends on.

