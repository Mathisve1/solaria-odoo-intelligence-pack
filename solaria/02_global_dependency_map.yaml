meta:
  title: Odoo 19.0 global module dependency map
  community_modules: 650
  enterprise_modules: 772
  enterprise_modules_depending_directly_on_community: 573
  note: >-
    Enterprise 19.0 is an add-ons-only layer: every Enterprise module ultimately depends on the
    Community code base (server + base addons). 'depends' lists direct dependencies as declared
    in each module manifest; transitive dependencies are not expanded.

